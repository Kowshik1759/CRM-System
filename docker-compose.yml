version: '3.8'

services:
  # Database Service
  mongodb:
    image: mongo:7.0
    container_name: crm_mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: crm_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend REST API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/crm_db
      JWT_SECRET: crm_enterprise_production_secret_key_2026
      JWT_EXPIRES_IN: 7d
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - crm_network

  # Frontend Web UI Service (Nginx SPA + Reverse Proxy)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - crm_network

volumes:
  mongo_data:
    driver: local

networks:
  crm_network:
    driver: bridge

